<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>robot3d</title>
  </head>
  <body>
    <nav id="tabs">
      <a href="#sim" data-view="sim">Simulator</a>
      <a href="#training" data-view="training">Training</a>
    </nav>
    <div id="toast" role="status" hidden></div>
    <div id="dashboard" hidden></div>

    <div id="viewport"></div>

    <div id="panel">
      <div class="title">
        <span id="connection-dot" class="dot" title="WebSocket connection"></span>
        <span id="robot-name">connecting…</span>
      </div>
      <div class="buttons">
        <button id="play-pause" disabled>Pause</button>
        <button id="reset" disabled>Reset</button>
      </div>
      <label class="toggle" title="Camera moves along with the robot (F)">
        <input type="checkbox" id="follow" checked /> Follow robot
      </label>
      <div class="push-box" title="Double-click a part of the robot to push it (away from the camera), for 0.1 s">
        <label for="push-force">Push force <span id="push-force-value"></span></label>
        <input type="range" id="push-force" min="10" max="300" step="5" value="60" />
      </div>
      <div id="policy-box" hidden>
        <div class="policy-label">Policy</div>
        <div class="modes" role="group" aria-label="Behavior">
          <button id="mode-walk" title="Walk (M switches)">Walk</button>
          <button id="mode-stand" title="Stand: stays upright in place, gets up after falls (M switches)">Stand</button>
        </div>
        <div id="policy-name" class="policy-name"></div>
        <div id="getup-name" class="getup-name"></div>
        <div id="recovering" class="recovering" hidden>fell, getting up…</div>
        <button id="policy-toggle" title="P">Take manual control</button>
      </div>
      <div class="stats">
        <span id="sim-time">t = 0.00 s</span>
        <span id="stream-fps" title="frames received from the server per second">0 fps</span>
      </div>
    </div>

    <div id="motors" class="panel"></div>

    <div id="help"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
