[project]
name = "robot3d"
version = "0.1.0"
description = "Design, simulate (MuJoCo), view (three.js) and train (RL) legged robots."
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
