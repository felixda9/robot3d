[project]
name = "robot3d"
version = "0.1.0"
description = "Design, simulate (MuJoCo), view (three.js) and train (RL) legged robots."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "mujoco>=3.14.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60  # seconds; a WebSocket test waiting for a message that never comes fails instead of hanging
