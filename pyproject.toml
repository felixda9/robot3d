[project]
name = "robot3d"
version = "0.1.0"
description = "Design, simulate (MuJoCo), view (three.js) and train (RL) legged robots."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "gymnasium>=1.3.0",
    "mujoco>=3.14.0",
    "mujoco-warp>=3.14.0",
    "psutil>=7.2.2",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
    "torch>=2.14.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
]

# PyTorch: the CUDA 13.0 build, for GPU training (scripts/train_gpu.py). It
# also runs everything on the CPU (SB3 CPU training, the web server). For a
# machine without an NVIDIA GPU, point this at https://download.pytorch.org/whl/cpu.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true  # only torch comes from here; everything else from PyPI

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60  # seconds; a WebSocket test waiting for a message that never comes fails instead of hanging
